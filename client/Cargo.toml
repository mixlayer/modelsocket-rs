[package]
name = "modelsocket"
version = "0.1.0"
edition = "2021"

[dependencies]
modelsocket-common = { path = "../common" }
tokio = { version = "1.38.0", features = ["full", "macros", "rt-multi-thread"] }
tokio-tungstenite = { version = "0.23.1", features = ["native-tls"] }
futures-util = "0.3.30"
url = "2.5.2"
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.120"
http = "1.1.0"
thiserror = "1.0.63"
tracing = "0.1.40"
uuid = { version = "1.9.1", features = ["v4"] }
futures = "0.3.31"
