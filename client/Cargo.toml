[package]
name = "modelsocket"
version = "0.1.0"
edition = "2021"

[dependencies]
modelsocket-common = { path = "../common" }
tokio = { version = "1", features = ["full", "macros", "rt-multi-thread"] }
tokio-tungstenite = { version = "0.23.1", features = ["native-tls"] }
futures-util = "0.3"
url = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = "1"
thiserror = "1"
tracing = "0.1"
uuid = { version = "1.9", features = ["v4"] }
futures = "0.3"
